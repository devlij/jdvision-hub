<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>European Cities — Music Videos · Jason D's Vision</title>
<meta name="description" content="Thirteen original songs about Europe's great cities, each with its own film. Free to watch. By The Music Audition.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jason D's Vision">
<meta property="og:title" content="European Cities — Music Videos · Jason D's Vision">
<meta property="og:description" content="Thirteen original songs about Europe's great cities, each with its own film. Free to watch.">
<meta property="og:url" content="https://jdvision.org/music.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ec; --bg2:#f4efe0; --panel:#fffdf7;
    --ink:#1c2029; --muted:#5e6675; --faint:#9aa1b1;
    --line:rgba(28,32,41,.13);
    --accent:#a37c26; --gold:#d8b36a; --gold-hi:#f0d79a;
    --serif:'Playfair Display',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  .topline{position:fixed;top:0;left:0;right:0;height:3px;z-index:130;
    background:linear-gradient(90deg,#8a641f,var(--gold) 30%,var(--gold-hi) 50%,var(--gold) 70%,#8a641f)}
  .wrap{max-width:1160px;margin:0 auto;padding:0 28px}
  header.topbar{background:#07090d;color:#f2f4f8}
  header.topbar .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:20px;padding-bottom:20px}
  .mark{font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:#f2f4f8;text-decoration:none;font-weight:600}
  .mark b{color:var(--gold);font-weight:600}
  .topbar nav{display:flex;gap:26px}
  .topbar nav a{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,244,248,.78);text-decoration:none}
  .topbar nav a:hover{color:var(--gold)}
  @media(max-width:640px){.topbar nav{display:none}}
  .hero{background:#07090d;color:#f2f4f8;text-align:center;padding:72px 28px 60px}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,5vw,54px);line-height:1.15;margin-bottom:14px}
  .hero h1 em{color:var(--gold);font-style:italic}
  .hero p{max-width:640px;margin:0 auto;color:rgba(242,244,248,.72);font-size:17px}
  .hero .free{display:inline-block;margin-top:18px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(216,179,106,.45);border-radius:999px;padding:8px 20px}
  .grid{padding:56px 0 80px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:34px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(28,32,41,.06)}
  .cover{position:relative;aspect-ratio:16/9;overflow:hidden;cursor:pointer;background:#0a0c10}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .cover:hover img{transform:scale(1.04)}
  .cover .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,7,10,.72) 0%,rgba(5,7,10,.18) 45%,rgba(5,7,10,0) 70%)}
  .cover .titles{position:absolute;left:0;right:0;bottom:0;padding:48px 20px 22px;text-align:center;color:#fff}
  .cover .titles .place{display:block;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-hi);font-weight:600;margin-bottom:8px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .cover .titles h2{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.15;text-shadow:0 2px 16px rgba(0,0,0,.65),0 1px 4px rgba(0,0,0,.8)}
  .cover .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);width:76px;height:76px;border-radius:50%;
    background:rgba(250,246,236,.94);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 30px rgba(0,0,0,.35);transition:transform .25s ease,background .25s ease}
  .cover .play:hover{transform:translate(-50%,-58%) scale(1.08);background:#fff}
  .cover .play svg{width:30px;height:30px;fill:#1c2029;margin-left:4px}
  .player{display:none;padding:12px 14px 18px}
  .player.open{display:block}
  .player blockquote{margin:0 auto !important}
  .direct{padding:6px 14px 20px}
  .direct .note{text-align:center;font-size:13px;color:var(--muted);padding:14px 6px 4px}
  .direct blockquote{margin:0 auto !important}
  footer{border-top:1px solid var(--line);padding:34px 0 44px;color:var(--muted);font-size:14px;text-align:center}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="topline"></div>
<header class="topbar">
  <div class="wrap">
    <a class="mark" href="https://jdvision.org/">Jason <b>D's</b> Vision</a>
    <nav>
      <a href="https://jdvision.org/">Galleries</a>
      <a href="https://jdvision.org/music.html">Music</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>European <em>Cities</em></h1>
    <p>Thirteen original songs about Europe's great cities — each one a small film about the place. By The Music Audition.</p>
    <span class="free">Free to watch</span>
  </div>
</section>

<main class="grid">
  <div class="wrap">
    <div class="cards" id="cards"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>Music by <a href="https://www.instagram.com/themusicaudition/">The Music Audition</a> · Free to watch · <a href="https://jdvision.org/">Jason D's Vision</a></p>
  </div>
</footer>

<script>
const VIDEOS = [
  {place:"Helsinki · Finland", title:"HelsinkiBurns",
   cover:"https://devlij.github.io/jason-ds-vision-finland-preview/assets/fi-01-001-daylight-16x9.png",
   ig:"https://www.instagram.com/reel/DWkLrkSjYxx/"},
  {place:"Copenhagen · Denmark", title:"CopenhagenMoves",
   cover:"https://denmark.jdvision.org/library/world/Denmark/Copenhagen/dk-01-002-daylight-16x9.png",
   ig:"https://www.instagram.com/reel/DWRYdVSjYfB/"},
  {place:"Stockholm · Sweden", title:"Between Islands",
   cover:"https://sweden.jdvision.org/assets/sweden/Stockholm/se-01-003-16x9.png",
   ig:"https://www.instagram.com/reel/DWZLc9sDTI-/"},
  {place:"Rome · Italy", title:"Rome, Still",
   cover:"https://devlij.github.io/jason-ds-vision-italy-assets/assets/it-01-002-16x9.png",
   ig:"https://www.instagram.com/reel/DWCyd_-jdVA/"},
  {place:"Prague · Czechia", title:"Prague Before the Bells",
   cover:null,
   ig:"https://www.instagram.com/reel/DV7JyWUjD9d/"},
  {place:"Venice · Italy", title:"Venice",
   cover:"https://devlij.github.io/jason-ds-vision-italy-assets/assets/it-01-174-16x9.png",
   ig:"https://www.instagram.com/reel/DV1ausbkRD9/"},
  {place:"Lucerne · Switzerland", title:"Above the Lake Line",
   cover:"https://switzerland.jdvision.org/library/world/Switzerland/Lucerne/ch-01-002-16x9.png",
   ig:"https://www.instagram.com/reel/DVzeiQIjNDw/"},
  {place:"Vienna · Austria", title:"Vienna",
   cover:null,
   ig:"https://www.instagram.com/reel/DVzYSNzjDD1/"},
  {place:"Lisbon · Portugal", title:"Wind Over Lisbon",
   cover:null,
   ig:"https://www.instagram.com/reel/DVtr2kYkc8E/"},
  {place:"Paris · France", title:"After Midnight in Paris",
   cover:"https://france.jdvision.org/assets/fr-01-001-16x9.png",
   ig:"https://www.instagram.com/reel/DVtixbiDerL/"},
  {place:"Amsterdam · Netherlands", title:"Amsterdam",
   cover:"https://netherlands.jdvision.org/library/world/Netherlands/Amsterdam/nl-01-018-daylight-16x9.png",
   ig:"https://www.instagram.com/reel/DVtfgCvjcyX/"},
  {place:"Barcelona · Spain", title:"Barcelona",
   cover:"https://spain.jdvision.org/es-01-001-daylight-r4-16x9.png",
   ig:"https://www.instagram.com/reel/DVnDXV9DDpg/"},
  {place:"Spain", title:"sobremesa",
   cover:"https://spain.jdvision.org/es-01-008-postcard-16x9.png",
   ig:"https://www.instagram.com/reel/DcWiToKTxNK/"},
];

const cards = document.getElementById('cards');
VIDEOS.forEach((v, i) => {
  const a = document.createElement('article');
  a.className = 'card';
  if (v.cover) {
    a.innerHTML =
      '<div class="cover" data-i="'+i+'" role="button" tabindex="0" aria-label="Play '+v.title+'">'+
        '<img src="'+v.cover+'" alt="'+v.title+' — '+v.place+'" loading="lazy">'+
        '<div class="shade"></div>'+
        '<button class="play" aria-hidden="true" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'+
        '<div class="titles"><span class="place">'+v.place+'</span><h2>'+v.title+'</h2></div>'+
      '</div>'+
      '<div class="player" id="player-'+i+'"></div>';
  } else {
    a.innerHTML =
      '<div class="direct">'+
        '<div class="note"><span class="place" style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600">'+v.place+'</span>'+
        '<h2 style="font-family:var(--serif);font-size:24px;font-weight:600;text-align:center">'+v.title+'</h2></div>'+
        '<blockquote class="instagram-media" data-instgrm-permalink="'+v.ig+'" data-instgrm-version="14"></blockquote>'+
      '</div>';
  }
  cards.appendChild(a);
});

cards.addEventListener('click', e => {
  const c = e.target.closest('.cover');
  if (!c) return;
  const i = c.getAttribute('data-i');
  const p = document.getElementById('player-'+i);
  if (p.classList.contains('open')) return;
  p.innerHTML = '<blockquote class="instagram-media" data-instgrm-permalink="'+VIDEOS[i].ig+'" data-instgrm-version="14"></blockquote>';
  p.classList.add('open');
  if (window.instgrm) window.instgrm.Embeds.process();
  c.querySelector('.play').style.display = 'none';
});
cards.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('cover')) {
    e.preventDefault(); e.target.click();
  }
});
</script>
<script async src="https://www.instagram.com/embed.js"></script>
</body>
</html>
