<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Explore the Collection — Jason D's Vision</title>
<link rel="stylesheet" href="map-vendor/maplibre-gl.css">
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060d;
    font-family: Georgia, 'Times New Roman', serif; color:#f2ede3; overflow:hidden; }
  header { height:64px; display:flex; align-items:center; gap:14px; padding:0 20px;
    background:#04060d; border-bottom:1px solid #2a2f3a; position:relative; z-index:30; }
  header .brand { font-size:20px; letter-spacing:.5px; }
  header .brand em { font-style:normal; color:#e8b64c; }
  header .sub { font-size:13px; color:#9aa3b2; font-family: Verdana, sans-serif; }
  header .back { margin-left:auto; font-family: Verdana, sans-serif; font-size:13px;
    color:#e8b64c; text-decoration:none; border:1px solid #4a3f2c; border-radius:6px;
    padding:7px 14px; white-space:nowrap; }
  header .back:hover { background:#1a1f29; }
  #stage { position:absolute; top:64px; bottom:34px; left:0; right:0; overflow:hidden;
    background: radial-gradient(ellipse at 50% 38%, #0a1734 0%, #050a1a 55%, #020409 100%); }
  #map { position:absolute; inset:0; }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(2,3,8,.5) 100%); }
  /* gem markers */
  .gem { border-radius:50%; cursor:pointer; border:1px solid rgba(255,242,205,.7);
    background: radial-gradient(circle at 35% 30%, #fffbe8 0%, #ffdf7e 26%, #eda93a 54%, rgba(237,169,58,.32) 72%, rgba(237,169,58,0) 80%);
    animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 9px 2px rgba(240,190,70,.45), 0 0 22px 5px rgba(240,190,70,.14); }
    50%     { box-shadow: 0 0 13px 3px rgba(240,190,70,.65), 0 0 34px 9px rgba(240,190,70,.22); }
  }
  .gem .tip { position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%);
    background:rgba(8,11,22,.94); border:1px solid #2a2f3a; color:#f2ede3;
    font-family:Verdana, sans-serif; font-size:12px; border-radius:6px; padding:5px 10px;
    white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .2s; }
  .gem:hover .tip { opacity:1; }
  /* popup */
  .maplibregl-popup.gem-popup .maplibregl-popup-content {
    background:rgba(12,16,30,.97); border:1px solid #3a4356; border-radius:12px;
    padding:14px 16px; color:#f2ede3; font-family:Georgia, serif;
    box-shadow:0 8px 40px rgba(0,0,0,.65), 0 0 24px rgba(232,182,76,.12); }
  .maplibregl-popup.gem-popup .maplibregl-popup-tip { border-top-color:#3a4356 !important; }
  .gem-popup .pop-country { font-size:18px; margin-bottom:2px; padding-right:22px; }
  .gem-popup .pop-country em { font-style:normal; color:#e8b64c; }
  .gem-popup .pop-count { font-family:Verdana, sans-serif; font-size:12px; color:#9aa3b2; margin:4px 0 12px; }
  .gem-popup .pop-count b { color:#e8b64c; }
  .gem-popup .pop-link { display:inline-block; font-family:Verdana, sans-serif; font-size:13px;
    background:linear-gradient(180deg,#f5c765,#dfa63a); color:#14110a; text-decoration:none;
    padding:9px 18px; border-radius:7px; font-weight:bold; }
  .gem-popup .pop-link:hover { filter:brightness(1.08); }
  .gem-popup .pop-close { position:absolute; top:6px; right:10px; background:none; border:none;
    color:#7c8595; font-size:18px; cursor:pointer; padding:4px; }
  .gem-popup .pop-close:hover { color:#f2ede3; }
  /* controls */
  .ctl { position:absolute; left:12px; bottom:12px; z-index:15; display:flex; flex-direction:column; gap:6px; }
  .ctl button { width:38px; height:38px; border-radius:8px; border:1px solid #3a4356;
    background:rgba(10,14,26,.9); color:#e8b64c; font-size:19px; cursor:pointer;
    font-family:Verdana, sans-serif; line-height:1; }
  .ctl button:hover { background:#1a2133; }
  .legend { position:absolute; bottom:12px; right:12px; z-index:15; background:rgba(8,11,22,.88);
    border:1px solid #2a2f3a; border-radius:8px; padding:10px 14px;
    font-family:Verdana, sans-serif; font-size:11px; color:#cfd6e2; }
  .legend .row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .legend .dot { border-radius:50%; display:inline-block;
    background:radial-gradient(circle, #ffe27a 0%, #f0b73e 60%, rgba(240,183,62,0) 78%); }
  .maplibregl-ctrl-attrib { background:rgba(6,9,18,.7) !important; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib a { color:#5c6678 !important; font-size:10px !important;
    font-family:Verdana, sans-serif; }
  footer { position:absolute; bottom:0; left:0; right:0; height:34px; display:flex;
    align-items:center; justify-content:space-between; padding:0 20px; z-index:30;
    background:#04060d; border-top:1px solid #2a2f3a;
    font-family:Verdana, sans-serif; font-size:11px; color:#7c8595; }
  @media (max-width:640px) {
    header .sub { display:none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Jason D's <em>Vision</em></div>
  <div class="sub">Explore the collection — pinch to zoom, drag to pan, tap a gem.</div>
  <a class="back" href="https://jdvision.org/">&larr; Back to Jason D's Vision</a>
</header>
<div id="stage">
  <div id="map"></div>
  <div id="vignette"></div>
  <div class="ctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">&minus;</button>
    <button id="zreset" aria-label="Reset view">&#8962;</button>
  </div>
  <div class="legend">
    <div class="row"><span class="dot" style="width:12px;height:12px"></span> ~100 scenes</div>
    <div class="row"><span class="dot" style="width:18px;height:18px"></span> ~300 scenes</div>
    <div class="row"><span class="dot" style="width:24px;height:24px"></span> ~550 scenes</div>
    <div class="row" style="color:#7c8595">Gem size &#8733; scene count</div>
  </div>
</div>
<footer>
  <span>Scene counts from live gallery data &mdash; snapshot <span id="snap">…</span></span>
  <span>Vector tiles: Powered by Esri</span>
</footer>

<script src="map-vendor/maplibre-gl.js"></script>
<script src="map-data.js"></script>
<script>
(function(){
  'use strict';
  document.getElementById('snap').textContent = MAP_SNAPSHOT;

  /* ---- custom "Obsidian Gem" style on Esri's free vector tiles ---- */
  const ESRI = 'https://basemaps.arcgis.com/arcgis/rest/services/World_Basemap_v2/VectorTileServer/tile/{z}/{y}/{x}.pbf';
  const GLYPHS = 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf';
  const GOLD = '#c9a227', GOLD_HI = '#f0cd6e';
  const style = {
    version: 8,
    glyphs: GLYPHS,
    sources: { esri: { type: 'vector', tiles: [ESRI], maxzoom: 16 } },
    layers: [
      { id: 'background', type: 'background', paint: { 'background-color': '#071a3d' } },
      /* ocean depth bands — technical sonar feel */
      { id: 'depth-shallow', type: 'fill', source: 'esri', 'source-layer': 'Bathymetry',
        filter: ['==', '_symbol', 0], paint: { 'fill-color': '#0d2a68' } },
      { id: 'depth-mid', type: 'fill', source: 'esri', 'source-layer': 'Bathymetry',
        filter: ['all', ['>=', '_symbol', 1], ['<=', '_symbol', 2]], paint: { 'fill-color': '#0a2258' } },
      { id: 'depth-deep', type: 'fill', source: 'esri', 'source-layer': 'Bathymetry',
        filter: ['>=', '_symbol', 3], paint: { 'fill-color': '#081c4e' } },
      /* land */
      { id: 'land', type: 'fill', source: 'esri', 'source-layer': 'Land',
        filter: ['==', '_symbol', 0], paint: { 'fill-color': '#0e2b2e' } },
      { id: 'ice', type: 'fill', source: 'esri', 'source-layer': 'Land',
        filter: ['==', '_symbol', 1], paint: { 'fill-color': '#17394a' } },
      { id: 'urban', type: 'fill', source: 'esri', 'source-layer': 'Urban area',
        paint: { 'fill-color': '#133239', 'fill-opacity': 0.9 } },
      { id: 'greenery', type: 'fill', source: 'esri', 'source-layer': 'Openspace or forest',
        paint: { 'fill-color': '#10402f', 'fill-opacity': 0.55 } },
      /* inland water */
      { id: 'water-area', type: 'fill', source: 'esri', 'source-layer': 'Water area',
        paint: { 'fill-color': '#0a2358' } },
      { id: 'water-area-lg', type: 'fill', source: 'esri', 'source-layer': 'Water area large scale',
        paint: { 'fill-color': '#0a2358' } },
      { id: 'water-area-md', type: 'fill', source: 'esri', 'source-layer': 'Water area medium scale',
        paint: { 'fill-color': '#0a2358' } },
      /* crisp coastline */
      { id: 'coastline', type: 'line', source: 'esri', 'source-layer': 'Coastline',
        paint: { 'line-color': '#2e6bb0', 'line-width': 1, 'line-opacity': 0.9 } },
      { id: 'rivers', type: 'line', source: 'esri', 'source-layer': 'Water line',
        paint: { 'line-color': '#2a5f9e', 'line-width': 0.8, 'line-opacity': 0.85 } },
      /* admin boundaries — gold technical lines */
      { id: 'admin1', type: 'line', source: 'esri', 'source-layer': 'Boundary line',
        filter: ['all', ['==', '_symbol', 1], ['!in', 'Viz', 3]],
        paint: { 'line-color': GOLD, 'line-opacity': 0.20, 'line-width': 0.8 } },
      { id: 'admin0-casing', type: 'line', source: 'esri', 'source-layer': 'Boundary line',
        filter: ['all', ['==', '_symbol', 0], ['!in', 'Viz', 3]],
        paint: { 'line-color': GOLD, 'line-opacity': 0.30, 'line-width': 2.6 } },
      { id: 'admin0', type: 'line', source: 'esri', 'source-layer': 'Boundary line',
        filter: ['all', ['==', '_symbol', 0], ['!in', 'Viz', 3]],
        paint: { 'line-color': GOLD_HI, 'line-opacity': 0.8, 'line-width': 1.1 } },
      /* transport detail at higher zooms */
      { id: 'ferries', type: 'line', source: 'esri', 'source-layer': 'Ferry', minzoom: 5,
        paint: { 'line-color': '#3f6fae', 'line-width': 1, 'line-dasharray': [2, 2], 'line-opacity': 0.7 } },
      { id: 'roads', type: 'line', source: 'esri', 'source-layer': 'Road', minzoom: 6,
        paint: { 'line-color': '#33465e', 'line-opacity': 0.85,
                 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.5, 12, 2.2] } },
      { id: 'rail', type: 'line', source: 'esri', 'source-layer': 'Railroad', minzoom: 8,
        paint: { 'line-color': '#46586f', 'line-width': 1, 'line-dasharray': [3, 2], 'line-opacity': 0.6 } },
      { id: 'buildings', type: 'fill', source: 'esri', 'source-layer': 'Building', minzoom: 13,
        paint: { 'fill-color': '#1c3a55', 'fill-opacity': 0.9 } },
      /* labels */
      { id: 'ocean-labels', type: 'symbol', source: 'esri', 'source-layer': 'Marine waterbody/label',
        layout: { 'text-field': '{_name}', 'text-font': ['Noto Sans Italic'], 'text-size': 13,
                  'text-letter-spacing': 0.25, 'text-max-width': 6 },
        paint: { 'text-color': '#5f83c2', 'text-halo-color': '#071a3d', 'text-halo-width': 1.5 } },
      { id: 'country-labels', type: 'symbol', source: 'esri', 'source-layer': 'Admin0 point',
        layout: { 'text-field': '{_name}', 'text-font': ['Noto Sans Regular'], 'text-transform': 'uppercase',
                  'text-letter-spacing': 0.18, 'text-max-width': 9,
                  'text-size': ['interpolate', ['linear'], ['zoom'], 2, 10, 8, 15] },
        paint: { 'text-color': '#d9b95c', 'text-halo-color': '#04101f', 'text-halo-width': 1.6 } },
      { id: 'city-dots', type: 'circle', source: 'esri', 'source-layer': 'City small scale', minzoom: 4.5,
        paint: { 'circle-radius': 1.8, 'circle-color': '#caa53d', 'circle-opacity': 0.85,
                 'circle-stroke-color': '#0a1424', 'circle-stroke-width': 0.6 } },
      { id: 'city-labels', type: 'symbol', source: 'esri', 'source-layer': 'City small scale', minzoom: 5,
        layout: { 'text-field': '{_name}', 'text-font': ['Noto Sans Regular'], 'text-size': 10.5,
                  'text-offset': [0, 0.9], 'text-anchor': 'top', 'text-max-width': 8 },
        paint: { 'text-color': '#b9c4d6', 'text-halo-color': '#04101f', 'text-halo-width': 1.4 } },
      { id: 'city-labels-lg', type: 'symbol', source: 'esri', 'source-layer': 'City large scale', minzoom: 9,
        layout: { 'text-field': '{_name_global}', 'text-font': ['Noto Sans Regular'], 'text-size': 11.5,
                  'text-offset': [0, 0.9], 'text-anchor': 'top', 'text-max-width': 8 },
        paint: { 'text-color': '#cdd7e6', 'text-halo-color': '#04101f', 'text-halo-width': 1.4 } }
    ]
  };

  const HOME = { center: [13, 49.5], zoom: 4.0, pitch: 30, bearing: 0 };
  const map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: HOME.center, zoom: HOME.zoom, pitch: HOME.pitch, bearing: HOME.bearing,
    minZoom: 2.4, maxZoom: 14,
    attributionControl: { compact: true },
    fadeDuration: 150
  });
  map.setFog({
    'color': '#0b1c3f', 'high-color': '#274a86', 'horizon-blend': 0.12,
    'space-color': '#01030a', 'star-intensity': 0.45
  });
  map.touchZoomRotate.enableRotation();

  /* ---- gem markers ---- */
  function radiusFor(s){ return Math.max(6 + Math.sqrt(s) * 0.85, 12); }
  let popup = null;
  function closePopup(){ if (popup) { popup.remove(); popup = null; } }
  function openPopup(c){
    closePopup();
    const html =
      '<button class="pop-close" aria-label="Close">&times;</button>' +
      '<div class="pop-country">' + c.name + ' <em>&#9670;</em></div>' +
      '<div class="pop-count"><b>' + c.scenes + '</b> scenes in the gallery</div>' +
      '<a class="pop-link" target="_blank" rel="noopener" href="' + c.url + '">Open gallery &rarr;</a>';
    popup = new maplibregl.Popup({ closeButton: false, className: 'gem-popup',
                                   offset: 20, maxWidth: '260px', anchor: 'bottom' })
      .setLngLat([c.lng, c.lat]).setHTML(html).addTo(map);
    popup.getElement().querySelector('.pop-close')
      .addEventListener('click', (e)=>{ e.stopPropagation(); closePopup(); });
  }
  map.on('load', ()=>{
    COUNTRIES.forEach((c)=>{
      const el = document.createElement('div');
      el.className = 'gem';
      const r = radiusFor(c.scenes);
      el.style.width = el.style.height = (r * 2) + 'px';
      el.innerHTML = '<span class="tip"><b>' + c.name + '</b> — ' + c.scenes + ' scenes</span>';
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        closePopup();
        map.flyTo({ center: [c.lng, c.lat], zoom: Math.max(map.getZoom(), 5.5),
                    pitch: 30, duration: 1500, essential: true });
        openPopup(c);
      });
      new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat([c.lng, c.lat]).addTo(map);
    });
  });
  map.on('click', closePopup);
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closePopup(); });

  /* ---- controls ---- */
  document.getElementById('zin').addEventListener('click', ()=>map.zoomIn({ duration: 300 }));
  document.getElementById('zout').addEventListener('click', ()=>map.zoomOut({ duration: 300 }));
  document.getElementById('zreset').addEventListener('click', ()=>{
    closePopup();
    map.flyTo({ center: HOME.center, zoom: HOME.zoom, pitch: HOME.pitch,
                bearing: HOME.bearing, duration: 1400, essential: true });
  });
})();
</script>
</body>
</html>
